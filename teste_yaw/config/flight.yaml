# Parametros da missao teste_yaw — perfil: flight
#
# Estes valores sobrescrevem os padroes do codigo. Trocar de simulacao para
# voo real deve ser trocar de arquivo aqui, nunca editar o .cpp.
teste_yaw_node:
  ros__parameters:
    # Decolagem (NED: altura negativa e para cima)
    takeoff_height: -1.0
    max_vertical_velocity: 1.2
    position_tolerance: 0.15

    # Pouso
    landing_velocity_max: 0.5
    landing_velocity_min: 0.15
    max_base_height: 0.5
    landing_timeout: 5.0

    # Movimento horizontal
    max_horizontal_velocity: 0.75

    # Parametros do ensaio
    # A manobra e: gira 90, avanca r, gira 180, avanca r -- repetida n vezes.
    # Em voo real o r comeca menor que na simulacao: a primeira coisa que este
    # ensaio deve provar e que o drone gira sem escorregar, e para isso nao e
    # preciso atravessar a area de voo.
    n_voltas: 3.0
    distancia_avanco: 1.5     # o "r", em metros

    # Tolerancia de cabeceio, em radianos (0.05 rad ~ 2.9 graus).
    yaw_tolerance: 0.05

    # Tetos de tempo por perna, em segundos.
    rotation_timeout: 15.0
    advance_timeout: 30.0

# O system_health do drone_lib tambem le deste arquivo.
system_health:
  ros__parameters:
    publish_rate: 1.0
